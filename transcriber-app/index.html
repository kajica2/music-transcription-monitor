<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcriber — MTM</title>

  <!-- VexFlow (notation) -->
  <script src="https://unpkg.com/vexflow@4.2.3/releases/vexflow-min.js"></script>
  <!-- WaveSurfer v7 (waveform) -->
  <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ── Site header ──────────────────────────────────────── -->
<header class="site-header">
  <div class="site-header__inner">
    <div class="brand">
      <div class="brand__mark">♪</div>
      <div class="brand__text">
        <h1>Transcriber</h1>
        <p>AMT · Solo Instrument</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
        <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <button class="btn" id="debug-toggle" aria-label="Toggle debug log">Debug Log</button>
      <a class="btn btn--outline" href="../dashboard/index.html">← Dashboard</a>
    </div>
  </div>
</header>

<!-- ── Toolbar ──────────────────────────────────────────── -->
<div class="toolbar">
  <div class="toolbar__left">
    <button class="btn btn--primary" id="play-btn" disabled>▶ Play</button>
    <button class="btn" id="stop-btn" disabled>■ Stop</button>
    <span class="toolbar__sep"></span>
    <button class="btn" id="mic-btn" title="Record from microphone">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      Mic
    </button>
    <button class="btn" id="clear-btn" title="Clear all">Clear</button>
  </div>
  <div class="toolbar__center">
    <span class="toolbar__label" id="time-display">—</span>
  </div>
  <div class="toolbar__right">
    <span class="toolbar__label">Sensitivity</span>
    <input type="range" id="sensitivity" min="1" max="10" value="5" class="range-input">
    <span class="toolbar__label" id="sensitivity-label">5</span>
    <span class="toolbar__sep"></span>
    <span class="toolbar__label">Min duration</span>
    <input type="range" id="min-duration" min="0.05" max="0.5" step="0.05" value="0.15" class="range-input">
    <span class="toolbar__label" id="min-duration-label">0.15s</span>
  </div>
</div>

<!-- ── Main three-panel layout ───────────────────────────── -->
<div class="app-layout">

  <!-- LEFT: File + Waveform -->
  <div class="panel" id="panel-waveform">
    <div class="panel-header">
      <h2>Audio</h2>
      <div class="panel-header__actions">
        <button class="btn btn--sm" id="zoom-in" title="Zoom in">+</button>
        <button class="btn btn--sm" id="zoom-out" title="Zoom out">−</button>
      </div>
    </div>
    <div class="panel-body">
      <div id="drop-zone">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <p>Drag &amp; drop audio file</p>
        <p class="drop-zone__sub">or <input type="file" id="file-input" accept="audio/*"> browse</p>
      </div>
      <div id="waveform-container">
        <div id="waveform"></div>
      </div>
      <div class="pitch-overlay" id="pitch-overlay"></div>
    </div>
    <div class="panel-footer">
      <label class="inline-label">Quality
        <select id="quality-select">
          <option value="keeper">Keeper</option>
          <option value="maybe" selected>Maybe</option>
          <option value="discard">Discard</option>
        </select>
      </label>
      <button class="btn btn--sm" id="export-segments">Export Segments</button>
    </div>
  </div>

  <!-- CENTER: Transcription + Debug -->
  <div class="panel" id="panel-transcription">
    <div class="panel-tabs">
      <button class="panel-tab is-active" data-tab="notes">Notes</button>
      <button class="panel-tab" data-tab="debug">Debug Log</button>
    </div>

    <div class="tab-content is-active" id="tab-notes">
      <div id="transcription-progress" class="progress-bar">Ready — drop an audio file or press Mic to begin</div>
      <div id="transcription-text"></div>
    </div>

    <div class="tab-content" id="tab-debug">
      <div class="debug-controls">
        <button class="btn btn--sm" id="clear-log">Clear</button>
        <button class="btn btn--sm" id="copy-log">Copy log</button>
        <span class="toolbar__label" id="log-count">0 entries</span>
      </div>
      <div id="debug-log"></div>
    </div>
  </div>

  <!-- RIGHT: Chart Preview -->
  <div class="panel" id="panel-chart">
    <div class="panel-header">
      <h2>Notation</h2>
      <div class="panel-header__actions">
        <button class="btn btn--sm" id="render-notation" title="Render VexFlow">Render</button>
      </div>
    </div>
    <div class="panel-body">
      <div id="vexflow-container">
        <div id="svg-output"></div>
      </div>
    </div>
    <div class="panel-footer export-options">
      <button class="btn btn--sm" id="export-svg">SVG</button>
      <button class="btn btn--sm" id="export-pdf">PDF</button>
      <button class="btn btn--sm" id="export-midi">MIDI</button>
      <button class="btn btn--sm" id="export-musicxml">MusicXML</button>
    </div>
  </div>

</div>

<!-- Piano roll (collapsible) -->
<details class="piano-roll" id="piano-roll">
  <summary class="piano-roll__header">
    <span>Piano Roll</span>
    <span class="piano-roll__count" id="piano-roll-count">0 notes</span>
  </summary>
  <div class="piano-roll__body" id="piano-roll-canvas-wrap">
    <canvas id="piano-roll-canvas"></canvas>
  </div>
</details>

<script src="js/main.js"></script>
</body>
</html>
